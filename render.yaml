# Configuration Render (Blueprint) : Render → New → Blueprint → ce dépôt.
# Les variables « sync: false » sont demandées à la création et ne sont jamais écrites ici.
services:
  - type: web
    name: veille-api
    runtime: docker
    # Offre gratuite : le serveur s'endort après 15 min sans visite. Un service externe
    # (cron-job.org) appelle /health toutes les 10 min pour le garder éveillé (voir docs/DEPLOIEMENT.md).
    plan: free
    # Le plus proche de la Côte d'Ivoire ; choisir la même région que le cluster Atlas si possible.
    region: frankfurt
    branch: main
    # Déploie seulement si la CI GitHub (types, tests, image Docker) passe.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    # Une seule instance : la collecte et les envois tournent dans le serveur.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      # Interface web (dépôt web_agent) : seule origine autorisée à appeler l'API, et cible des liens des e-mails.
      - key: CORS_ORIGINS
        value: https://veille-web-1e8i.onrender.com
      - key: WEB_URL
        value: https://veille-web-1e8i.onrender.com
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      # L'offre gratuite de Render bloque les ports SMTP 25, 465 et 587 : Brevo accepte aussi 2525.
      - key: SMTP_PORT
        value: '2525'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Render place un proxy devant l'API : nécessaire pour lire la vraie adresse IP des visiteurs.
      - key: TRUST_PROXY
        value: '1'
